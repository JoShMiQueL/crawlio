name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keeps the Release PR (accumulated changelog + version bump) open and,
  # once a human merges it, creates the tag + GitHub release.
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # release PR + tag + GitHub release
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          # Manifest config (not `release-type:` input) — `bump-minor-pre-major`
          # (0.x breaking → minor) is only configurable via the config file;
          # setting `release-type` here would make the action ignore it.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GITHUB_TOKEN-created tags don't fire `push: tags` workflows (GitHub's
  # recursion guard), so verify + publish must live inside THIS workflow.
  # release.yml's manual tag path stays as the escape hatch.
  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    steps:
      # Check out the tag release-please just created — it points at the
      # release-PR merge commit, where package.json already matches the
      # tag, so release.yml's tag-match guard is unnecessary here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile

      # Guard: the version must be new AND above the published `latest` —
      # npm lets an older version publish onto `latest`, which would
      # silently downgrade the default install for consumers.
      - name: version is unpublished and newer
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "crawlio@$version" dist.tarball --silent 2>/dev/null | grep -q .; then
            echo "crawlio@$version is already published — bump package.json and retag" >&2
            exit 1
          fi
          latest="$(npm view crawlio version --silent 2>/dev/null || true)"
          if [ -n "$latest" ] && ! ./node_modules/.bin/semver "$version" -r ">$latest" >/dev/null; then
            echo "crawlio@$version is not greater than published latest ($latest)" >&2
            exit 1
          fi

      # Full proof chain on the tagged commit before anything ships.
      - run: bun run check
      - run: bun run build
      - run: bun run check:pack
      # --with-deps apt-installs chromium's system libraries in the
      # throwaway consumer project — same as the ci e2e lane.
      - run: bun scripts/e2e.ts --with-deps

  publish:
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      id-token: write # OIDC for npm provenance / trusted publishing
      contents: write # parity with the release.yml publish job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # dist/ is built explicitly below — `--ignore-scripts` skips the
      # `prepack` (`bun run check && bun run build`), which would re-run
      # the whole suite `verify` already proved on this same commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Trusted publishing needs npm >= 11.5.1; pinned to the documented
      # floor (no floating "latest" — same exact-pin policy as actions).
      - run: npm i -g npm@11.15.0
      - run: npm publish --provenance --access public --ignore-scripts

      # No `gh release create` — release-please already created the GitHub
      # release with categorized notes when it tagged.
