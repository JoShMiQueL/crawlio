name: release

on:
  push:
    tags: ["v*"]
  # Manual rehearsal trigger — same verify chain, but publish is a
  # `npm publish --dry-run` and the GitHub release is skipped, so the
  # whole path can be exercised before v0.1.0 exists.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      # Tag push checks out the tagged commit; GITHUB_REF_NAME is the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile

      # Guard: the tag must equal `v` + package.json version — prevents
      # publishing v0.2.0 while package.json still says 0.1.0. Tag-push
      # only: on workflow_dispatch GITHUB_REF_NAME is the selected
      # branch, which never matches `v` + version — a rehearsal is not
      # shipping a tag, so the guard does not apply.
      - name: tag matches package.json version
        if: github.event_name == 'push'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "tag '$GITHUB_REF_NAME' does not match package.json version ('$expected')" >&2
            exit 1
          fi

      # Guard: the version must be new AND above the published `latest` —
      # npm lets an older version publish onto `latest`, which would
      # silently downgrade the default install for consumers.
      - name: version is unpublished and newer
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "crawlio@$version" dist.tarball --silent 2>/dev/null | grep -q .; then
            echo "crawlio@$version is already published — bump package.json and retag" >&2
            exit 1
          fi
          latest="$(npm view crawlio version --silent 2>/dev/null || true)"
          if [ -n "$latest" ] && ! ./node_modules/.bin/semver "$version" -r ">$latest" >/dev/null; then
            echo "crawlio@$version is not greater than published latest ($latest)" >&2
            exit 1
          fi

      # Full proof chain on the tagged commit before anything ships.
      - run: bun run check
      - run: bun run build
      - run: bun run check:pack
      # --with-deps apt-installs chromium's system libraries in the
      # throwaway consumer project — same as the ci e2e lane.
      - run: bun scripts/e2e.ts --with-deps

  publish:
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      id-token: write # OIDC for npm provenance / trusted publishing
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # dist/ is built explicitly below — `--ignore-scripts` skips the
      # `prepack` (`bun run check && bun run build`), which would re-run
      # the whole suite `verify` already proved on this same commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Trusted publishing needs npm >= 11.5.1; pinned to the documented
      # floor (no floating "latest" — same exact-pin policy as actions).
      - run: npm i -g npm@11.15.0
      # Two sibling publish steps, split on the event: workflow_dispatch
      # is the release rehearsal — `--dry-run` exercises the manifest,
      # tarball and registry warnings without shipping — while a tag
      # push publishes for real. Kept as siblings (not a shell branch)
      # so each path reads as one obvious line.
      - run: npm publish --provenance --access public --ignore-scripts --dry-run
        if: github.event_name == 'workflow_dispatch'
      - run: npm publish --provenance --access public --ignore-scripts
        if: github.event_name == 'push'

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        # Rehearsals ship nothing — no GitHub release either.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
