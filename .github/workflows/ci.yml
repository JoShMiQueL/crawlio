name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Needed for push events (git diff); PRs use the API but harmless
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig*.json'
              - 'biome.json'
              - '.github/workflows/**'

  # Meta lane — platform-independent checks (biome/tsc/publint/attw) run
  # once here instead of duplicating per-OS in the check matrix. npm run
  # keeps them on node, same as before. build before check:pack — publint
  # and attw's pack consume dist/.
  meta:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:pack

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        node: [26]
        include:
          - os: windows-2025
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun is the toolchain's PM; node is the RUNTIME under test. npm run
      # below executes the node_modules/.bin shims with their node shebang,
      # so the checks prove the library works when nothing runs under Bun.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned for a reproducible lane — same exact-pin policy as the
          # Node matrix (no floating "latest").
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile
      # Meta checks are platform-independent — lint/typecheck/pack live in
      # the meta job; this lane is runtime coverage (test/build on the
      # real node).
      - run: npm run test
      - run: npm run build

  # Bun lane — runtime-class coverage ("does the suite run under the Bun
  # runtime") plus the compiled binaries: one OS, no full check —
  # biome/build/pack stay with the Node lanes.
  check-bun:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      # `test/` scopes collection — a bare `bun test` would also pick up
      # e2e/render.test.ts, whose `crawlio` self-import resolves to dist/
      # (absent in this lane) instead of skipping.
      - run: bun test test/
      # bun's native typecheck, complementing tsc (authoritative, node
      # lanes). `bun check` resolves to the package.json "check" script
      # when one exists (script names shadow the builtin), so the bare
      # flag form checks the default tsconfig, and the -p form runs from
      # runner.temp — a directory with no package.json to shadow it.
      - run: bun --check
      - run: bun check -p "${{ github.workspace }}/tsconfig.test.json"
        working-directory: ${{ runner.temp }}
      # `build:bin` compiles the TS sources straight into standalone exes —
      # Bun transpiles, so this lane needs no node/tsc. --help/--version
      # prove the artifacts actually boot (the version is --define-stamped
      # from package.json — no on-disk package.json inside a binary).
      - run: bun run build:bin
      - run: ./dist-bin/crawlio-mcp --help
      - run: ./dist-bin/crawlio --version

  # Real-browser consumer lane — scripts/e2e.ts packs the tarball, `npm
  # install`s it into a throwaway project where the packed `crawlio install`
  # fetches playwright-core (+ chromium), and runs the CRAWLIO_E2E-gated
  # e2e/render.test.ts against `crawlio` / `crawlio/playwright` like a real
  # consumer. Same `code` gate; when it skips, ci-success reads the skipped
  # result as a pass below.
  e2e-browsers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The consumer runs npm/npx — setup-node puts it on our supported
      # floor; the runner's stock node is below engines and would warn.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      # Both engines' versions pin their browser downloads, so bun.lock
      # is the cache key; ~/.cache/ms-playwright and ~/.cache/puppeteer
      # are the engines' default browser dirs on Linux.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/puppeteer
          key: playwright-${{ hashFiles('bun.lock') }}
      # --with-deps forwards to `crawlio install`, which passes it through
      # to `playwright-core install`, apt-installing chromium's system
      # libraries inside the consumer project.
      - run: bun scripts/e2e.ts --with-deps

  ci-success:
    needs: [changes, meta, check, check-bun, e2e-browsers]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - run: |
          if [ "${{ needs.changes.result }}" = "failure" ] || [ "${{ needs.changes.result }}" = "cancelled" ]; then exit 1; fi
          meta="${{ needs.meta.result }}"
          if [ "$meta" = "failure" ] || [ "$meta" = "cancelled" ]; then exit 1; fi
          result="${{ needs.check.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then exit 1; fi
          bun="${{ needs.check-bun.result }}"
          if [ "$bun" = "failure" ] || [ "$bun" = "cancelled" ]; then exit 1; fi
          e2e="${{ needs.e2e-browsers.result }}"
          if [ "$e2e" = "failure" ] || [ "$e2e" = "cancelled" ]; then exit 1; fi
          echo "ci: ${result} (skipped is fine — docs-only change)"
