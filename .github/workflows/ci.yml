name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Needed for push events (git diff); PRs use the API but harmless
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'biome.json'
              - '.github/workflows/**'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        node: [22, 24, 26]
        include:
          - os: windows-2025
            node: 24
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          install: false
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm check:pack

  # Bun lane — runtime-class coverage only ("does the suite run under the
  # Bun runtime"): one OS, no pnpm check — biome/tsc/build/pack stay with
  # the Node lanes.
  check-bun:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for a reproducible lane — same exact-pin policy as the
          # Node matrix (no floating "latest").
          bun-version: "1.4.0"
      # No --frozen-lockfile: pnpm-lock.yaml is the canonical lockfile and
      # Bun cannot read it; bun.lock is gitignored, so the flag would pin
      # nothing while implying otherwise.
      - run: bun install
      - run: bun test

  ci-success:
    needs: [changes, check, check-bun]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - run: |
          if [ "${{ needs.changes.result }}" = "failure" ] || [ "${{ needs.changes.result }}" = "cancelled" ]; then exit 1; fi
          result="${{ needs.check.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then exit 1; fi
          bun="${{ needs.check-bun.result }}"
          if [ "$bun" = "failure" ] || [ "$bun" = "cancelled" ]; then exit 1; fi
          echo "ci: ${result} (skipped is fine — docs-only change)"
